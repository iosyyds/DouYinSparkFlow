name: Sync from upstream

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repository
        run: |
          set -e
          git clone --bare https://github.com/2061360308/DouYinSparkFlow.git upstream.git
          cd upstream.git
          git push --all "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --tags "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          echo "Sync complete!"
