name: Sync from upstream

on:
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream and force push branches and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror https://github.com/2061360308/DouYinSparkFlow.git upstream.git
          cd upstream.git
          # Remove pull request refs (cannot be pushed)
          git for-each-ref --format='%(refname)' refs/pull/ | xargs -r git update-ref -d
          git remote set-url --push origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          # Push all branches and tags (not pull refs)
          git push --all origin
          git push --tags origin
          cd ..
          rm -rf upstream.git
          echo "Sync complete! Full repository with history, branches, tags and binaries imported."
