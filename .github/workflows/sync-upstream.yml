name: Sync from upstream

on:
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream and force push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror https://github.com/2061360308/DouYinSparkFlow.git upstream.git
          cd upstream.git
          git remote set-url --push origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push --mirror origin
          cd ..
          rm -rf upstream.git
          echo "Sync complete! Full repository with history and binaries imported."
