name: Import Binary Assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
      - name: Download and commit binary assets
        run: |
          set +e
          UPSTREAM="https://raw.githubusercontent.com/2061360308/DouYinSparkFlow/main"
          
          mkdir -p docs/images docs/static/css/element-plus docs/static/js
          
          # Download all files using the GitHub API to avoid URL encoding issues
          python3 << 'PYEOF'
          import os
          import urllib.request
          import json
          
          upstream = "https://raw.githubusercontent.com/2061360308/DouYinSparkFlow/main"
          
          files_to_download = [
              "docs/images/Cookies获取.png",
              "docs/images/cover.png",
              "docs/images/image.png",
              "docs/images/qrcode_1788144510171.jpg",
              "docs/images/启用action.png",
              "docs/images/启用workflow.png",
              "docs/images/好友抖音号获取.png",
              "docs/images/好友昵称获取.png",
              "docs/images/屏幕截图 2026-02-14 223607.png",
              "docs/images/屏幕截图 2026-02-14 224614.png",
              "docs/images/屏幕截图 2026-02-14 224915.png",
              "docs/images/屏幕截图 2026-02-14 224951.png",
              "docs/images/账号信息获取.png",
              "docs/images/配置生成器.png",
              "docs/static/favicon.ico",
              "docs/static/icon.png",
              "docs/static/css/element-plus/index.css",
              "docs/static/js/vue.global.js",
              "docs/static/js/icons-vue.js",
              "docs/static/js/element-plus.js",
              "docs/index.html",
              "utils/chinese_new_year_2026_mare.py",
          ]
          
          for filepath in files_to_download:
              os.makedirs(os.path.dirname(filepath), exist_ok=True)
              url = f"{upstream}/{filepath}"
              encoded_url = urllib.parse.quote(url, safe=":/")
              try:
                  urllib.request.urlretrieve(encoded_url, filepath)
                  print(f"OK: {filepath}")
              except Exception as e:
                  print(f"FAIL: {filepath} - {e}")
          PYEOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/images/ docs/static/ docs/index.html utils/chinese_new_year_2026_mare.py
          git status
          git commit -m "feat: import binary assets and large files from upstream" && git push || echo "Done"
